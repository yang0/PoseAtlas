<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pose Atlas · Page Directory</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #222; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(1680px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 36px); }
    .intro { margin: 0 0 28px; color: #666; }
    h2 { margin: 34px 0 14px; font-size: 22px; }
    h2 small { color: #777; font-size: 14px; font-weight: normal; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .card { overflow: hidden; border: 1px solid #ddd; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / 4%); }
    .card img { display: block; width: 100%; height: auto; cursor: zoom-in; }
    .meta { padding: 12px 14px 14px; font-size: 15px; line-height: 1.5; }
    .path { margin-top: 3px; color: #777; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; word-break: break-all; }
    .lightbox[hidden] { display: none; }
    .lightbox { position: fixed; z-index: 10; inset: 0; display: flex; align-items: center; justify-content: center; padding: 28px; background: rgb(0 0 0 / 84%); }
    .lightbox img { max-width: 96vw; max-height: 94vh; width: auto; height: auto; object-fit: contain; cursor: zoom-out; box-shadow: 0 8px 40px rgb(0 0 0 / 35%); }
    .close { position: absolute; top: 12px; right: 18px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgb(255 255 255 / 15%); color: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
    .close:hover, .close:focus-visible { background: rgb(255 255 255 / 28%); }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 620px); padding-top: 20px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      h2 { margin-top: 28px; }
      .lightbox { padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pose Atlas · Page Directory</h1>
    <p class="intro">人工选图目录：共 30 张联系表，每张包含 16 个姿势。点击任意图页查看大图。</p>
    <div id="directory"></div>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="联系表大图" hidden>
    <button id="close" class="close" type="button" aria-label="关闭大图">×</button>
    <img id="lightbox-image" alt="联系表大图">
  </div>

  <script>
    const pages = [
      {page:'PAGE-01', category:'POSE ATLAS · STANDING · 01', range:'ST-001–ST-016', path:'assets/contact-sheets/ST-01.webp'},
      {page:'PAGE-02', category:'POSE ATLAS · STANDING · 02', range:'ST-017–ST-032', path:'assets/contact-sheets/ST-02.webp'},
      {page:'PAGE-03', category:'POSE ATLAS · STANDING · 03', range:'ST-033–ST-048', path:'assets/contact-sheets/ST-03.webp'},
      {page:'PAGE-04', category:'POSE ATLAS · STANDING · 04', range:'ST-049–ST-064', path:'assets/contact-sheets/ST-04.webp'},
      {page:'PAGE-05', category:'POSE ATLAS · STANDING · 05', range:'ST-065–ST-080', path:'assets/contact-sheets/ST-05.webp'},
      {page:'PAGE-06', category:'POSE ATLAS · STANDING · 06', range:'ST-081–ST-096', path:'assets/contact-sheets/ST-06.webp'},
      {page:'PAGE-07', category:'POSE ATLAS · STANDING · 07', range:'ST-097–ST-112', path:'assets/contact-sheets/ST-07.webp'},
      {page:'PAGE-08', category:'POSE ATLAS · SITTING · 01', range:'SI-001–SI-016', path:'assets/contact-sheets/SI-01.webp'},
      {page:'PAGE-09', category:'POSE ATLAS · SITTING · 02', range:'SI-017–SI-032', path:'assets/contact-sheets/SI-02.webp'},
      {page:'PAGE-10', category:'POSE ATLAS · SITTING · 03', range:'SI-033–SI-048', path:'assets/contact-sheets/SI-03.webp'},
      {page:'PAGE-11', category:'POSE ATLAS · SITTING · 04', range:'SI-049–SI-064', path:'assets/contact-sheets/SI-04.webp'},
      {page:'PAGE-12', category:'POSE ATLAS · KNEELING · 01', range:'KN-001–KN-016', path:'assets/contact-sheets/KN-01.webp'},
      {page:'PAGE-13', category:'POSE ATLAS · KNEELING · 02', range:'KN-017–KN-032', path:'assets/contact-sheets/KN-02.webp'},
      {page:'PAGE-14', category:'POSE ATLAS · KNEELING · 03', range:'KN-033–KN-048', path:'assets/contact-sheets/KN-03.webp'},
      {page:'PAGE-15', category:'POSE ATLAS · KNEELING · 04', range:'KN-049–KN-064', path:'assets/contact-sheets/KN-04.webp'},
      {page:'PAGE-16', category:'POSE ATLAS · SQUATTING · 01', range:'SQ-001–SQ-016', path:'assets/contact-sheets/SQ-01.webp'},
      {page:'PAGE-17', category:'POSE ATLAS · SQUATTING · 02', range:'SQ-017–SQ-032', path:'assets/contact-sheets/SQ-02.webp'},
      {page:'PAGE-18', category:'POSE ATLAS · SQUATTING · 03', range:'SQ-033–SQ-048', path:'assets/contact-sheets/SQ-03.webp'},
      {page:'PAGE-19', category:'POSE ATLAS · FLOOR · 01', range:'FL-001–FL-016', path:'assets/contact-sheets/FL-01.webp'},
      {page:'PAGE-20', category:'POSE ATLAS · FLOOR · 02', range:'FL-017–FL-032', path:'assets/contact-sheets/FL-02.webp'},
      {page:'PAGE-21', category:'POSE ATLAS · FLOOR · 03', range:'FL-033–FL-048', path:'assets/contact-sheets/FL-03.webp'},
      {page:'PAGE-22', category:'POSE ATLAS · FLOOR · 04', range:'FL-049–FL-064', path:'assets/contact-sheets/FL-04.webp'},
      {page:'PAGE-23', category:'POSE ATLAS · LEANING · 01', range:'LE-001–LE-016', path:'assets/contact-sheets/LE-01.webp'},
      {page:'PAGE-24', category:'POSE ATLAS · LEANING · 02', range:'LE-017–LE-032', path:'assets/contact-sheets/LE-02.webp'},
      {page:'PAGE-25', category:'POSE ATLAS · LEANING · 03', range:'LE-033–LE-048', path:'assets/contact-sheets/LE-03.webp'},
      {page:'PAGE-26', category:'POSE ATLAS · WALKING · 01', range:'WK-001–WK-016', path:'assets/contact-sheets/WK-01.webp'},
      {page:'PAGE-27', category:'POSE ATLAS · WALKING · 02', range:'WK-017–WK-032', path:'assets/contact-sheets/WK-02.webp'},
      {page:'PAGE-28', category:'POSE ATLAS · MOVEMENT · 01', range:'MV-001–MV-016', path:'assets/contact-sheets/MV-01.webp'},
      {page:'PAGE-29', category:'POSE ATLAS · MOVEMENT · 02', range:'MV-017–MV-032', path:'assets/contact-sheets/MV-02.webp'},
      {page:'PAGE-30', category:'POSE ATLAS · MOVEMENT · 03', range:'MV-033–MV-048', path:'assets/contact-sheets/MV-03.webp'}
    ];

    const directory = document.getElementById('directory');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeButton = document.getElementById('close');

    const groups = pages.reduce((map, page) => {
      const key = page.category.split(' · ')[1].split(' · ')[0];
      (map[key] ||= []).push(page);
      return map;
    }, {});

    Object.entries(groups).forEach(([category, entries]) => {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.innerHTML = `${category} <small>(${entries.length * 16} poses / ${entries.length} pages)</small>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      entries.forEach((entry) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<img src="../${entry.path}" alt="${entry.page}，${entry.range}" data-full="../${entry.path}"><div class="meta"><div><b>${entry.page}</b> · ${entry.category}</div><div>${entry.range}</div><div class="path">${entry.path}</div></div>`;
        grid.appendChild(card);
      });
      section.append(heading, grid);
      directory.appendChild(section);
    });

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImage.removeAttribute('src');
      document.body.style.overflow = '';
    }

    directory.addEventListener('click', (event) => {
      const image = event.target.closest('img[data-full]');
      if (!image) return;
      lightboxImage.src = image.dataset.full;
      lightboxImage.alt = image.alt;
      lightbox.hidden = false;
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    });
    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lightboxImage.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });
  </script>
</body>
</html>
