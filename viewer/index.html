<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pose Atlas 0.2</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}.wrap{max-width:1500px;margin:auto;padding:18px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}select,input{padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:white;border-radius:12px;overflow:hidden;border:1px solid #ddd}.img{aspect-ratio:4/5;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}.meta{padding:10px}.id{font-weight:750}.name{margin-left:8px}.sum{font-size:13px;color:#555;margin-top:6px;line-height:1.45}.tags{font-size:12px;color:#777;margin-top:8px}.badge{display:inline-block;padding:2px 6px;background:#eee;border-radius:999px;margin-right:4px}h1{margin:0}small{color:#666}</style></head><body><div class="wrap"><h1>Pose Atlas <small>v0.2.0 · 480 Families</small></h1>
<div class="bar"><select id="cat"><option value="">全部类别</option><option>ST</option><option>SI</option><option>KN</option><option>SQ</option><option>FL</option><option>LE</option><option>WK</option><option>MV</option></select><select id="shape"><option value="">全部 Shape</option></select><select id="int"><option value="">全部强度</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><select id="diff"><option value="">全部难度</option><option>easy</option><option>medium</option><option>hard</option></select><input id="q" placeholder="搜索编号/名称/描述/标签"></div><div id="count"></div><div id="grid" class="grid"></div></div><script src="poses.js"></script><script>
const data=window.POSE_ATLAS; const $=id=>document.getElementById(id); const shapes=[...new Set(data.map(x=>x.shape.primary))].sort(); shapes.forEach(s=>$('shape').insertAdjacentHTML('beforeend',`<option>${s}</option>`));
function render(){let q=$('q').value.trim().toLowerCase();let arr=data.filter(x=>(!$('cat').value||x.category===$('cat').value)&&(!$('shape').value||x.shape.primary===$('shape').value)&&(!$('int').value||String(x.intensity)===$('int').value)&&(!$('diff').value||x.difficulty===$('diff').value)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('count').textContent=`${arr.length} poses`;$('grid').innerHTML=arr.map(x=>`<div class=card><div class=img><img src="../${x.image}" alt="${x.id}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.parentNode.textContent='${x.image}'"></div><div class=meta><div><span class=id>${x.id}</span><span class=name>${x.name_zh}</span></div><div class=sum>${x.summary}</div><div class=tags><span class=badge>${x.shape.primary}</span><span class=badge>I${x.intensity}</span><span class=badge>${x.difficulty}</span></div></div></div>`).join('')};['cat','shape','int','diff','q'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();</script><p><a href="page_directory.html">打开人工选图目录 / Page Directory</a></p>
</body></html>
